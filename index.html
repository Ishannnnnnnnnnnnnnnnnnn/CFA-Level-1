<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CFA L1 // Braindump - Personal Study OS</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Custom Styling matching Reference Aesthetic -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#F7F9F6] text-[#18181B] min-h-screen antialiased selection:bg-[#E2EFE7] selection:text-[#1C3E2C]">

  <!-- Persistent Timer Bar -->
  <div id="persistent-timer-bar" class="sticky top-0 z-50 hidden"></div>

  <div class="min-h-screen flex">
    <!-- Left Sidebar (Collapsible Taskbar) -->
    <aside id="main-sidebar" class="w-64 border-r border-[#E4E7E1] bg-[#F7F9F6] hidden md:flex flex-col justify-between p-5 fixed top-0 bottom-0 left-0 overflow-y-auto z-40 transition-all duration-200">
      <div class="space-y-6">
        <!-- Brand Header & Collapse Sidebar Button -->
        <div class="flex items-center justify-between gap-2">
          <div class="space-y-0.5 cursor-pointer sidebar-brand-text" data-tab="control_room">
            <div class="font-extrabold text-base tracking-tight font-mono text-[#18181B]">CFA L1 // BRAINDUMP</div>
            <div class="text-[11px] font-mono font-semibold text-[#A1A1AA] uppercase tracking-wider">PERSONAL STUDY OS</div>
          </div>
          <button id="btn-toggle-sidebar" class="p-2 hover:bg-[#EEF2EC] text-[#71717A] hover:text-[#18181B] rounded-lg transition-colors font-mono text-sm font-bold flex-shrink-0" title="Toggle Taskbar">
            «
          </button>
        </div>

        <!-- Sidebar Navigation Menu (5 Coupled Hubs with Crisp SVG Icons) -->
        <nav class="space-y-1">
          <button class="sidebar-nav-btn active" data-tab="control_room">
            <svg class="w-5 h-5 text-[#2E6F40] sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="sidebar-text">Home</span>
          </button>

          <button class="sidebar-nav-btn" data-tab="curriculum">
            <svg class="w-5 h-5 text-[#71717A] sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            <span class="sidebar-text">Curriculum &amp; LES</span>
          </button>

          <button class="sidebar-nav-btn" data-tab="practice">
            <svg class="w-5 h-5 text-[#71717A] sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            <span class="sidebar-text">Practice &amp; Review</span>
          </button>

          <button class="sidebar-nav-btn" data-tab="weekly_plan">
            <svg class="w-5 h-5 text-[#71717A] sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="sidebar-text">Weekly Plan</span>
          </button>

          <button class="sidebar-nav-btn" data-tab="profile">
            <svg class="w-5 h-5 text-[#71717A] sidebar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            <span class="sidebar-text">Resources &amp; Profile</span>
          </button>
        </nav>
      </div>

      <!-- Bottom Actions & Clean Footer (No duplicate "Built by" here) -->
      <div class="space-y-4 pt-4 border-t border-[#E4E7E1]">
        <button id="btn-sidebar-start-study" class="w-full py-3 bg-[#18181B] hover:bg-[#27272A] text-white font-mono text-xs font-bold rounded-xl flex items-center justify-center gap-2 transition-colors shadow-xs">
          <span class="pulse-dot"></span>
          <span class="sidebar-text">START STUDY</span>
        </button>

        <div class="space-y-0.5 font-mono text-[11px] text-[#A1A1AA] sidebar-text">
          <div class="font-bold text-[#71717A] uppercase tracking-wider">LET ME EXPLAIN</div>
          <div>CFA Level I 2026 / 2027</div>
        </div>
      </div>
    </aside>

    <!-- Main Right Content Area -->
    <div id="main-content-wrapper" class="md:pl-64 flex-1 flex flex-col min-h-screen transition-all duration-200">
      <!-- Top Bar Header -->
      <header class="h-16 border-b border-[#E4E7E1] px-6 sm:px-8 flex items-center justify-between bg-[#F7F9F6] sticky top-0 z-30">
        <div class="flex items-center gap-3">
          <!-- Expand Sidebar Trigger -->
          <button id="btn-expand-sidebar" class="hidden px-3 py-1.5 bg-white border border-[#E4E7E1] hover:bg-[#F7F9F6] text-[#18181B] font-mono text-xs font-bold rounded-xl transition-colors shadow-xs items-center gap-1.5">
            <span>»</span>
            <span>Taskbar</span>
          </button>
          <div id="header-countdown-badge" class="font-mono text-xs font-semibold text-[#71717A] tracking-wider uppercase">
            NOV 2026 &bull; 82 DAYS LEFT
          </div>
        </div>

        <div class="flex items-center gap-3">
          <button id="btn-global-search" class="px-3.5 py-1.5 bg-white border border-[#E4E7E1] hover:border-[#CBD2C8] rounded-xl text-xs font-mono text-[#71717A] flex items-center gap-2 shadow-xs transition-colors">
            <svg class="w-3.5 h-3.5 text-[#71717A]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <span>Search everything</span>
            <kbd class="text-[10px] text-[#A1A1AA]">/ SEARCH</kbd>
          </button>
        </div>
      </header>

      <!-- Main Content Container -->
      <main id="app-main-content" class="p-6 sm:p-8 flex-1 tab-content-fade">
        <!-- Dynamic view renders here -->
      </main>

      <!-- Clean Footer (No duplicate "Built by" here) -->
      <footer class="border-t border-[#E4E7E1] bg-[#F7F9F6] py-6 px-8 text-xs font-sans text-[#A1A1AA] flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>Curriculum structure referenced from Let Me Explain's Level I Learning Module Coverage.</p>
        <p class="font-mono text-[11px] text-[#71717A]">CFA Level I Personal Operating System</p>
      </footer>
    </div>
  </div>

  <!-- Mobile Bottom Bar with Crisp SVG Icons -->
  <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#E4E7E1] flex justify-around py-2 z-40 font-mono text-[10px] font-bold text-[#71717A]">
    <button class="flex flex-col items-center py-1" data-tab="control_room">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span>Home</span>
    </button>
    <button class="flex flex-col items-center py-1" data-tab="curriculum">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
      <span>Curriculum</span>
    </button>
    <button class="flex flex-col items-center py-1" data-tab="practice">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
      <span>Practice</span>
    </button>
    <button class="flex flex-col items-center py-1" data-tab="weekly_plan">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      <span>Plan</span>
    </button>
    <button class="flex flex-col items-center py-1" data-tab="profile">
      <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span>Profile</span>
    </button>
  </div>

  <!-- Standalone App Script -->
  <script src="js/app.js"></script>
</body>
</html>
